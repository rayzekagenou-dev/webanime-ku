<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - RayzeWebAnime</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: #0b0b14;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: #161621;
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 400px;
      width: 100%;
      border: 1px solid #26263a;
    }
    .login-box .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-box .logo h1 {
      font-size: 28px;
      font-weight: 800;
    }
    .login-box .logo h1 span {
      color: #e94560;
    }
    .login-box .logo p {
      color: #8888aa;
      font-size: 13px;
      margin-top: 4px;
    }
    .login-box label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 4px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      background: #0b0b14;
      border: 1px solid #26263a;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      transition: 0.2s;
    }
    .login-box input:focus {
      border-color: #e94560;
    }
    .login-box .btn-login {
      width: 100%;
      padding: 14px;
      background: #e94560;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 10px;
    }
    .login-box .btn-login:active {
      transform: scale(0.97);
    }
    .login-box .btn-register {
      width: 100%;
      padding: 14px;
      background: #1a1a2e;
      border: 1px solid #26263a;
      border-radius: 12px;
      color: #eee;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-box .btn-register:active {
      transform: scale(0.97);
    }
    .login-box .divider {
      text-align: center;
      color: #555577;
      font-size: 13px;
      margin: 16px 0;
    }
    .login-box .tester {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #555577;
    }
    .login-box .tester a {
      color: #e94560;
      font-weight: 600;
      cursor: pointer;
    }
    .login-box .terms {
      text-align: center;
      font-size: 11px;
      color: #555577;
      margin-top: 20px;
      line-height: 1.6;
    }
    .msg {
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
    .msg.error {
      background: #ff174422;
      color: #ff1744;
      border: 1px solid #ff1744;
      display: block;
    }
    .msg.success {
      background: #00d4ff22;
      color: #00d4ff;
      border: 1px solid #00d4ff;
      display: block;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo">
      <h1>Rayze<span>WebAnime</span></h1>
      <p>Platform anime untuk komunitas Indonesia</p>
    </div>

    <div id="message" class="msg"></div>

    <label>Username</label>
    <input type="text" id="username" placeholder="Masukkan username" />

    <label>Password</label>
    <input type="password" id="password" placeholder="Masukkan password" />

    <button class="btn-login" onclick="login()">🚀 Masuk</button>
    <button class="btn-register" onclick="register()">📝 Buat Akun Baru</button>

    <div class="divider">atau</div>

    <div class="tester">
      <a onclick="testerLogin()">Masuk sebagai Tester</a>
    </div>

    <div class="terms">
      Dengan masuk, kamu menyetujui <a href="#">ketentuan layanan</a>.<br />
      Aplikasi ini tidak mengunggah atau mendistribusikan konten media.
    </div>
  </div>

  <script>
    // Ambil data user dari LocalStorage
    function getUsers() {
      return JSON.parse(localStorage.getItem('users')) || [];
    }

    function saveUsers(users) {
      localStorage.setItem('users', JSON.stringify(users));
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        showMessage('❌ Isi username dan password!', 'error');
        return;
      }

      const users = getUsers();
      const user = users.find(u => u.username === username && u.password === password);

      if (user) {
        // Simpan user yang login
        localStorage.setItem('currentUser', JSON.stringify({
          name: user.displayName || user.username,
          tag: user.tag || '#000000',
          avatar: user.avatar || user.username.charAt(0).toUpperCase(),
          isAdmin: user.isAdmin || false,
          isPremium: user.isPremium || false,
          username: user.username
        }));
        showMessage('✅ Login berhasil!', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } else {
        showMessage('❌ Username atau password salah!', 'error');
      }
    }

    function register() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        showMessage('❌ Isi username dan password!', 'error');
        return;
      }

      if (username.length < 3) {
        showMessage('❌ Username minimal 3 karakter!', 'error');
        return;
      }

      if (password.length < 3) {
        showMessage('❌ Password minimal 3 karakter!', 'error');
        return;
      }

      let users = getUsers();

      // Cek duplikat
      if (users.find(u => u.username === username)) {
        showMessage('❌ Username sudah dipakai!', 'error');
        return;
      }

      // Tambah user baru
      users.push({
        username: username,
        password: password,
        displayName: username,
        tag: '#' + Math.floor(Math.random() * 900000 + 100000),
        avatar: username.charAt(0).toUpperCase(),
        isAdmin: false,
        isPremium: false
      });

      saveUsers(users);
      showMessage('✅ Akun berhasil dibuat! Silakan login.', 'success');

      // Kosongkan password
      document.getElementById('password').value = '';
    }

    function testerLogin() {
      // Cek apakah user tester sudah ada
      let users = getUsers();
      let tester = users.find(u => u.username === 'tester');

      if (!tester) {
        tester = {
          username: 'tester',
          password: 'tester',
          displayName: 'Tester',
          tag: '#999999',
          avatar: 'T',
          isAdmin: false,
          isPremium: false
        };
        users.push(tester);
        saveUsers(users);
      }

      localStorage.setItem('currentUser', JSON.stringify({
        name: tester.displayName,
        tag: tester.tag,
        avatar: tester.avatar,
        isAdmin: tester.isAdmin,
        isPremium: tester.isPremium,
        username: tester.username
      }));

      window.location.href = 'index.html';
    }

    // Cek apakah sudah login, redirect ke home
    if (localStorage.getItem('currentUser')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
      </html>
